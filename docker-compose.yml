# docker-compose.yml
version: '3.9'

services:
  mcp-server:
    build: ./mcp-server
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./projects:/projects
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - mcp-db
      - redis
    networks:
      - platform-net

  mcp-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - mcp_db_data:/var/lib/postgresql/data
    networks:
      - platform-net

  redis:
    image: redis:7
    networks:
      - platform-net

  code-gen-worker:
    build: ./code-gen-worker
    deploy:
      replicas: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./projects:/projects
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
      - mcp-db
    networks:
      - platform-net

  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-net

volumes:
  mcp_db_data:

networks:
  platform-net:
    driver: bridge